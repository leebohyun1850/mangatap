<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MangaTap">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>MangaTap</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* 상단 바 */
  #bar {
    flex: 0 0 auto; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 10px; background: #161616; border-bottom: 1px solid #2a2a2a;
  }
  #bar.hidden { display: none; }
  #bar button {
    border: 0; border-radius: 9px; padding: 9px 11px; min-width: 0;
    font-size: 13px; font-weight: 600; color: #fff; background: #2b2b2b;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #bar button.on { background: #fff; color: #111; }
  #add { color: #111 !important; background: #fff !important; }

  /* 만화 화면 */
  #stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    touch-action: none; overscroll-behavior: none;
  }
  #page {
    display: block; max-width: 100%; max-height: 100%;
    width: auto; height: auto; object-fit: contain;
    -webkit-user-drag: none; pointer-events: none;
  }
  .zone {
    position: absolute; top: 0; bottom: 0;
    border: 0; background: transparent; padding: 0; margin: 0;
    touch-action: none;
  }
  #left   { left: 0;   width: 40%; }
  #center { left: 40%; width: 20%; }
  #right  { right: 0;  width: 40%; }

  #empty {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    padding: 28px; text-align: center; color: #aaa; line-height: 1.8; font-size: 14px;
  }
  #empty[hidden], #page[hidden] { display: none; }

  /* 확대/축소 */
  #page { will-change: transform; transform-origin: 50% 50%; }
  #page.anim { transition: transform .22s ease-out; }
  #zoomPill {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6;
    padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(25,25,25,.82); color: #fff; font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .2s, background .2s;
  }
  #zoomPill.show { opacity: 1; pointer-events: auto; }
  #zoomPill.idle { opacity: .6; }
  #zoomPill.orig {
    background: #1faa59; border-color: #a6f2c6; box-shadow: 0 0 0 3px rgba(31,170,89,.35);
    animation: origPop .35s ease-out;
  }
  @keyframes origPop {
    0% { transform: translateX(-50%) scale(.9); }
    60% { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* 패널 공통 */
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 20;
    padding-top: var(--barh, 56px);
    display: none; flex-direction: column;
  }
  .panel.open { display: flex; }

  /* 페이지 목록 */
  #pagePanel { background: rgba(0,0,0,.97); }
  #pagePanel h3 { margin: 0; padding: 14px 16px 8px; font-size: 14px; font-weight: 500; color: #aaa; }
  .scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 12px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-content: start; }
  #grid button {
    border: 0; border-radius: 10px; padding: 14px 0;
    font-size: 15px; font-weight: 600; color: #fff; background: #252525;
    font-variant-numeric: tabular-nums;
  }
  #grid button.cur { background: #fff; color: #111; }

  /* 작품 목록: 한 줄 3개, 화면에는 2줄씩 보이고 스크롤 */
  #workPanel { background: rgba(0,0,0,.6); }
  #sheet {
    flex: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #121212; border-bottom: 1px solid #2a2a2a; padding: 12px;
    overscroll-behavior: contain;
  }
  #workGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .card { position: relative; min-width: 0; }
  .card .cover {
    display: block; width: 100%; padding: 0; margin: 0; border: 2px solid transparent;
    border-radius: 10px; overflow: hidden; background: #222; aspect-ratio: 5 / 7;
    position: relative; height: auto;
  }
  .card.cur .cover { border-color: #fff; }
  .card .cover img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; max-height: none; display: block; object-fit: cover; object-position: top center; pointer-events: none; }
  .card .meta { height: 38px; padding: 4px 2px 0; font-size: 12px; line-height: 1.35; overflow: hidden; }
  .card .nm { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pg { color: #999; font-variant-numeric: tabular-nums; }
  .mini {
    position: absolute; top: 5px; width: 28px; height: 28px; border: 0; border-radius: 14px; padding: 0;
    font-size: 13px; color: #fff; background: rgba(0,0,0,.6);
  }
  .mini.ren { left: 5px; }
  .mini.del { right: 5px; }
  #noWorks { grid-column: 1 / -1; padding: 28px 0; text-align: center; color: #888; font-size: 14px; }

  /* 작품 순서 바꾸기 (꾹 눌러서 끌기) */
  #workGrid .card { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .card.dragging { z-index: 50; opacity: .93; transition: none !important; filter: drop-shadow(0 10px 16px rgba(0,0,0,.65)); }
  #workGrid.sorting .card:not(.dragging) { opacity: .8; }

  /* 그룹(폴더) */
  .card .cover.folder { background: #2a2a30; padding: 6px; }
  .fgrid { position: absolute; inset: 6px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
  .fgrid .tile { position: relative; min-width: 0; min-height: 0; border-radius: 5px; overflow: hidden; background: #3a3a42; }
  .fgrid .tile img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .card .cover { transition: transform .15s ease, outline-color .15s ease; outline: 3px solid transparent; }
  .card.merge .cover { outline-color: #4da3ff; transform: scale(1.06); }
  #gHead {
    position: sticky; top: 0; z-index: 3; margin: -12px -12px 8px; padding: 0 12px; height: 52px;
    display: flex; align-items: center; gap: 8px; background: #121212; border-bottom: 1px solid #2a2a2a;
  }
  #gHead[hidden] { display: none; }
  #gHead.drop { background: #1d3a5f; }
  #gHead button { border: 0; border-radius: 9px; padding: 8px 11px; font-size: 13px; font-weight: 600; color: #fff; background: #2b2b2b; white-space: nowrap; }
  #gName { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 그룹을 열 때: 누른 폴더 자리에서 커지며 열리는 효과 */
  @keyframes folderOpen { from { transform: scale(.78); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #sheet.opening { animation: folderOpen .24s ease-out; }

  /* 불러오기 메뉴 / 폴더 선택 목록 */
  #modal { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.72); padding: 16px; }
  #modal.open { display: flex; }
  #modalBox { width: min(100%, 420px); max-height: 82vh; max-height: 82dvh; background: #1a1a1a; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  #modalBox h3 { margin: 0; font-size: 16px; }
  #modalBox .sub { margin: 0; font-size: 12px; color: #9a9a9a; line-height: 1.5; }
  .mbtn { border: 0; border-radius: 12px; padding: 14px; text-align: left; font-size: 15px; font-weight: 600; color: #fff; background: #2b2b2b; }
  .mbtn small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: #aaa; line-height: 1.45; }
  .mbtn.primary { background: #fff; color: #111; }
  .mbtn.primary small { color: #555; }
  .mlist { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; }
  .mrow { display: flex; align-items: center; gap: 10px; background: #252525; border-radius: 10px; padding: 11px 12px; font-size: 14px; }
  .mrow input { width: 20px; height: 20px; flex: none; }
  .mrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .ct { color: #999; font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .mrow .tag { color: #f0b040; font-size: 11px; flex: none; }
  .mfoot { display: flex; gap: 8px; }
  .mfoot button { flex: 1; border: 0; border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 600; color: #fff; background: #2b2b2b; }
  .mfoot button.primary { background: #fff; color: #111; flex: 1.6; }
  .mfoot button:disabled { opacity: .4; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); z-index: 60; background: rgba(45,45,45,.96); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #busyText { white-space: pre-line; padding: 0 24px; }

  /* 저장 중 표시 */
  #busy {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(0,0,0,.8); font-size: 15px; line-height: 1.8;
  }
  #busy.open { display: flex; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<div id="bar">
  <button id="pages" type="button">☰ 0 / 0</button>
  <button id="works" type="button">작품 0</button>
  <button id="add" type="button">＋ 불러오기</button>
  <input id="files" type="file" accept="image/*,.webp,.jpg,.jpeg,.png" multiple>
  <input id="dirs" type="file" webkitdirectory multiple>
</div>

<main id="stage" aria-label="만화 페이지">
  <div id="empty">위의 <b>불러오기</b>를 눌러<br>만화 이미지들을 선택해 주세요.<br><small>불러온 작품은 앱을 닫아도 폰에 저장되어 남아 있습니다.<br>파일명 숫자 순서대로 정렬됩니다.<br>화면 가운데를 탭하면 위쪽 바를 숨기거나 보일 수 있어요.</small></div>
  <img id="page" alt="만화 페이지" hidden>
  <button class="zone" id="left"   aria-label="다음 페이지"></button>
  <button class="zone" id="center" aria-label="상단 바 숨김/표시"></button>
  <button class="zone" id="right"  aria-label="이전 페이지"></button>
  <div id="zoomPill"></div>
</main>

<div class="panel" id="pagePanel">
  <h3>이동할 페이지를 선택하세요</h3>
  <div class="scroll"><div id="grid"></div></div>
</div>

<div class="panel" id="workPanel">
  <div id="sheet">
    <div id="gHead" hidden><button id="gBack" type="button">‹ 목록</button><span id="gName"></span><button id="gRen" type="button">✎</button><button id="gUn" type="button">그룹 해제</button></div>
    <div id="workGrid"></div>
  </div>
</div>

<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>
<div id="busy"><div id="busyText">저장 중…</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const picker = $('files'), img = $('page'), empty = $('empty'), bar = $('bar');
  const pagesBtn = $('pages'), worksBtn = $('works'), addBtn = $('add');
  const pagePanel = $('pagePanel'), workPanel = $('workPanel');
  const grid = $('grid'), workGrid = $('workGrid'), sheet = $('sheet');
  const busy = $('busy'), busyText = $('busyText');
  const gHead = $('gHead'), gName = $('gName');

  /* ---------- 저장소 (IndexedDB, 실패 시 메모리) ---------- */
  let db = null;
  const mem = { works: new Map(), pages: new Map() };

  function openDB() {
    return new Promise(res => {
      if (!window.indexedDB) return res(null);
      try {
        const r = indexedDB.open('mangatap', 1);
        r.onupgradeneeded = () => {
          r.result.createObjectStore('works', { keyPath: 'id' });
          r.result.createObjectStore('pages');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
  }
  const reqP = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const txDone = tx => new Promise((ok, no) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => no(tx.error);
    tx.onabort = () => no(tx.error || new Error('abort'));
  });

  const store = {
    async listWorks() {
      if (!db) return [...mem.works.values()];
      return reqP(db.transaction('works').objectStore('works').getAll());
    },
    async getWork(id) {
      if (!db) return mem.works.get(id) || null;
      return (await reqP(db.transaction('works').objectStore('works').get(id))) || null;
    },
    async putWork(w) {
      if (!db) { mem.works.set(w.id, w); return; }
      const tx = db.transaction('works', 'readwrite');
      tx.objectStore('works').put(w);
      return txDone(tx);
    },
    async savePages(id, files, onProgress) {
      if (!db) { mem.pages.set(id, files); onProgress(files.length); return; }
      const CHUNK = 10;
      for (let i = 0; i < files.length; i += CHUNK) {
        const tx = db.transaction('pages', 'readwrite');
        const os = tx.objectStore('pages');
        files.slice(i, i + CHUNK).forEach((f, k) => os.put(f, [id, i + k]));
        await txDone(tx);
        onProgress(Math.min(i + CHUNK, files.length));
      }
    },
    async getPage(id, n) {
      if (!db) return (mem.pages.get(id) || [])[n] || null;
      return (await reqP(db.transaction('pages').objectStore('pages').get([id, n]))) || null;
    },
    async deleteWork(id) {
      if (!db) { mem.works.delete(id); mem.pages.delete(id); return; }
      const tx = db.transaction(['works', 'pages'], 'readwrite');
      tx.objectStore('works').delete(id);
      tx.objectStore('pages').delete(IDBKeyRange.bound([id, 0], [id, Infinity]));
      return txDone(tx);
    }
  };

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- 상태 ---------- */
  let works = [];          // { id, name, index, count, order, cover, groupId }
  let groups = [];         // { id, type:'group', name, order }
  let view = null;         // 지금 열어 둔 그룹 id (null이면 최상위 목록)
  let topListScrollTop = 0; // 그룹에 들어가기 직전 최상위 목록 위치
  let cur = -1;
  let currentUrl = null;
  let showToken = 0;
  let saveTimer = null;
  let coverUrls = [];
  let sortedAt = 0;   // 순서 바꾸기 직후 탭이 작품 열기로 오인되지 않도록
  let zs = 1, tx = 0, ty = 0;   // 확대 배율(화면 맞춤=1), 이동량
  const W = () => works[cur];

  const naturalCompare = (a, b) =>
    a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });

  function setBarHeightVar() {
    document.documentElement.style.setProperty('--barh', Math.ceil(bar.getBoundingClientRect().bottom) + 'px');
  }
  function closePanels() {
    pagePanel.classList.remove('open');
    workPanel.classList.remove('open');
    coverUrls.forEach(u => URL.revokeObjectURL(u)); coverUrls = [];
    updateButtons();
  }
  function updateButtons() {
    const w = W();
    pagesBtn.textContent = `☰ ${w ? w.index + 1 : 0} / ${w ? w.count : 0}`;
    worksBtn.textContent = works.length ? `작품 ${cur + 1}/${works.length}` : '작품 0';
    pagesBtn.classList.toggle('on', pagePanel.classList.contains('open'));
    worksBtn.classList.toggle('on', workPanel.classList.contains('open'));
  }

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const w = W(); if (!w) return;
      store.putWork(w).catch(() => {});
      ls.set('mangatap_cur', w.id);
    }, 400);
  }

  async function showPage() {
    const t = ++showToken;
    resetZoom(false);
    const w = W();
    if (!w) {
      img.hidden = true; empty.hidden = false;
      if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
      updateButtons(); return;
    }
    updateButtons();
    let blob = null;
    try { blob = await store.getPage(w.id, w.index); } catch (e) {}
    if (t !== showToken) return;
    if (!blob) {
      img.hidden = true; empty.hidden = false;
      empty.textContent = '이 페이지의 이미지를 찾을 수 없습니다. 작품을 닫고 다시 불러와 주세요.';
      return;
    }
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    img.src = currentUrl;
    img.hidden = false; empty.hidden = true;
    saveSoon();
  }
  function next() { const w = W(); if (w && w.index < w.count - 1) { w.index++; showPage(); } }
  function previous() { const w = W(); if (w && w.index > 0) { w.index--; showPage(); } }

  /* ---------- 페이지 목록 ---------- */
  function openPages() {
    const w = W(); if (!w) return;
    bar.classList.remove('hidden'); setBarHeightVar();
    workPanel.classList.remove('open');
    grid.innerHTML = '';
    for (let i = 0; i < w.count; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = i + 1;
      if (i === w.index) b.className = 'cur';
      b.addEventListener('click', () => { w.index = i; showPage(); closePanels(); });
      grid.appendChild(b);
    }
    pagePanel.classList.add('open'); updateButtons();
    const c = grid.querySelector('.cur'); if (c) c.scrollIntoView({ block: 'center' });
  }

  /* ---------- 그룹(폴더) 데이터 도우미 ---------- */
  const isGroup = o => !!o && o.type === 'group';
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function members(gid) { return works.filter(w => w.groupId === gid).sort((a, b) => a.order - b.order); }
  function topItems() {
    const items = groups.slice();
    works.forEach(w => { if (!w.groupId) items.push(w); });
    return items.sort((a, b) => a.order - b.order);
  }
  function flatWorks() {
    const out = [];
    topItems().forEach(it => { if (isGroup(it)) out.push(...members(it.id)); else out.push(it); });
    return out;
  }
  function resortWorks() {
    const id = W() ? W().id : null;
    works = flatWorks();
    cur = id ? works.findIndex(w => w.id === id) : -1;
  }
  function topRenumber() { topItems().forEach((it, i) => { it.order = i; }); }
  function renumber() {
    // 기본 이름("작품 N", "그룹 N")만 보이는 순서대로 번호를 다시 붙임. 직접 지은 이름은 그대로.
    flatWorks().forEach((w, i) => { if (/^작품 \d+$/.test(w.name)) w.name = `작품 ${i + 1}`; });
    groups.slice().sort((a, b) => a.order - b.order)
      .forEach((g, i) => { if (/^그룹 \d+$/.test(g.name)) g.name = `그룹 ${i + 1}`; });
  }
  function persistAll() { return Promise.all([...works, ...groups].map(o => store.putWork(o))).catch(() => {}); }
  function cleanupGroups() {
    groups = groups.filter(g => {
      if (works.some(w => w.groupId === g.id)) return true;
      store.deleteWork(g.id).catch(() => {});
      return false;
    });
    if (view && !groups.some(g => g.id === view)) view = null;
  }
  function restructure() { cleanupGroups(); topRenumber(); renumber(); resortWorks(); persistAll(); updateButtons(); }
  function nextGroupName() {
    const used = new Set(groups.map(g => g.name)); let n = 1;
    while (used.has(`그룹 ${n}`)) n++;
    return `그룹 ${n}`;
  }
  function mergeInto(dragId, targetId) {
    const d = works.find(w => w.id === dragId);
    if (!d) return;
    const tg = groups.find(g => g.id === targetId);
    if (tg) {
      const m = members(tg.id);
      d.groupId = tg.id; d.order = m.length ? m[m.length - 1].order + 1 : 0;
    } else {
      const t = works.find(w => w.id === targetId);
      if (!t || t === d) return;
      const g = { id: newId(), type: 'group', name: nextGroupName(), order: t.order };
      groups.push(g);
      t.groupId = g.id; t.order = 0;
      d.groupId = g.id; d.order = 1;

    restructure();
  }
  function dissolveGroup(g) {
    members(g.id).forEach((m, k) => { m.groupId = null; m.order = g.order + (k + 1) * 0.001; });

    store.deleteWork(g.id).catch(() => {});

  /* ---------- 불러오기 ---------- */
  function canvasToBlob(c) {
    return new Promise(r => {
      try { c.toBlob(b => r(b), 'image/jpeg', 0.78); } catch (e) { r(null); }
    }).then(b => {
      if (b && b.size > 0) return b;
      try {
        const bin = atob(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: 'image/jpeg' });
      } catch (e) { return null; }
    });
  }
  async function makeThumb(file) {
    const TW = 320;
    try {
      const bmp = await createImageBitmap(file);
      const h = Math.max(1, Math.round(bmp.height * (TW / bmp.width)));
      const c = document.createElement('canvas'); c.width = TW; c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, TW, h);
      if (bmp.close) bmp.close();
      const t = await canvasToBlob(c); if (t) return t;
    } catch (e) {}
    try {
      const url = URL.createObjectURL(file);
      const im = new Image(); im.src = url; await im.decode();
      const h = Math.max(1, Math.round(im.naturalHeight * (TW / im.naturalWidth)));
      const c = document.createElement('canvas'); c.width = TW; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, TW, h);
      URL.revokeObjectURL(url);
      const t = await canvasToBlob(c); if (t) return t;
    } catch (e) {}
    return null;   // 표지 실패 → 목록에서 첫 페이지로 대신 표시
  }
  // iOS가 파일 형식(MIME)을 비워 주는 경우가 있어서, 확장자로 형식을 명시해 둠 (webp 등)
  function typed(f) {
    if (f.type && f.type.startsWith('image/')) return f;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const map = { webp: 'image/webp', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', bmp: 'image/bmp', avif: 'image/avif' };
    return new Blob([f], { type: map[ext] || 'image/webp' });
  }
  function nextName() {
    const used = new Set(works.map(w => w.name));
    let n = 1;
    while (used.has(`작품 ${n}`)) n++;
    return `작품 ${n}`;
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }
  function openModal(build) { modalBox.innerHTML = ''; build(modalBox); modal.classList.add('open'); }
  function closeModal() { modal.classList.remove('open'); modalBox.innerHTML = ''; }
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function mbtn(title, sub, cls, fn) {
    const b = el('button', 'mbtn' + (cls ? ' ' + cls : ''), title); b.type = 'button';
    if (sub) b.appendChild(el('small', '', sub));

  const isImage = f => !f.name.startsWith('.') && (f.type.startsWith('image/') || /\.(webp|jpe?g|png|gif|bmp|avif)$/i.test(f.name));
  const relOf = f => f.webkitRelativePath || f.name;
  const relCompare = (a, b) => relOf(a).localeCompare(relOf(b), undefined, { numeric: true, sensitivity: 'base' });

  // 고른 폴더 안의 사진들을 "폴더별 작품"으로 나눔
  //  - 고른 폴더 안에 사진이 바로 있으면: 그 폴더 = 작품 1개
  //  - 고른 폴더 안에 하위 폴더들이 있으면: 하위 폴더 하나하나 = 작품 1개
  function groupByFolder(files) {
    const map = new Map(); let nested = false;
    files.forEach(f => {
      const parts = (f.webkitRelativePath || '').split('/').filter(Boolean);
      if (parts.length < 2) return;
      if (parts.some(x => x.startsWith('.') || x === '__MACOSX')) return;
      const dirs = parts.slice(0, -1);
      let key, name;
      if (dirs.length >= 2) { nested = true; key = dirs[0] + '/' + dirs[1]; name = dirs[1]; }
      else { key = dirs[0]; name = dirs[0]; }
      if (!map.has(key)) map.set(key, { name, files: [] });
      map.get(key).files.push(f);
    });
    const list = Array.from(map.values());
    list.forEach(g => g.files.sort(relCompare));
    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    return { list, nested };
  }

  async function importOne(name, rawFiles, onProgress, order) {
    const files = rawFiles.map(typed);
    const id = newId();
    try {
      const cover = await makeThumb(files[0]);
      await store.savePages(id, files, onProgress);
      const w = { id, name, index: 0, count: files.length, order, cover };
      await store.putWork(w);
      let saved = null;
      try { saved = await store.getWork(id); } catch (e) {}
      return saved || w;
    } catch (e) {
      try { await store.deleteWork(id); } catch (_) {}
      throw e;
    }
  }

  async function importBatch(items) {          // items: [{ name, files }]
    if (!items.length) return;
    closePanels(); closeModal();
    busy.classList.add('open');
    const base = Date.now(), done = [];
    let failed = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const label = items.length > 1 ? `(${i + 1}/${items.length}) ` : '';
      const show = n => { busyText.textContent = `저장 중… ${label}\n${it.name}\n${n} / ${it.files.length}`; };
      show(0);
      try {
        const w = await importOne(it.name, it.files, show, base + i);
        works.push(w); done.push(w);
      } catch (e) { failed++; }
    }
    if (done.length) {
      cur = works.indexOf(done[0]);
      ls.set('mangatap_cur', done[0].id);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      showPage();
    }
    busy.classList.remove('open');
    if (failed) alert(`${failed}개 작품은 저장하지 못했습니다. 폰의 저장 공간이 부족할 수 있어요.\n작품 수나 이미지 수를 줄여서 다시 시도해 주세요.`);
    if (done.length) toast(`${done.length}개 작품을 불러왔습니다`);
  }

  /* ---------- 확대/축소 (두 손가락) + 원본 100% 자동 맞춤 ---------- */
  const stage = $('stage'), pill = $('zoomPill');
  const SNAP_HI = 1.03, MAX_ZOOM = 4;   // 처음 불러온 모습 = 100%. 100~103%는 100%로 붙이고, 최대 400%까지 확대 (100%보다 작게는 축소 불가)
  let pillTimer = null, wasOrig = false, origNow = false;

  function metrics() {                   // 화면에 맞춘 상태의 이미지 크기와 중심 (확대 효과는 제외)
    const sr = stage.getBoundingClientRect();
    const padB = parseFloat(getComputedStyle(stage).paddingBottom) || 0;
    const W = sr.width, H = sr.height - padB;
    const iw = img.offsetWidth, ih = img.offsetHeight;
    return { L: { x: sr.left + W / 2, y: sr.top + H / 2 }, W, H, iw, ih };
  }
  function clampT(m, z, x, y) {          // 이미지가 화면 밖으로 너무 벗어나지 않게
    const mx = Math.max(0, (m.iw * z - m.W) / 2), my = Math.max(0, (m.ih * z - m.H) / 2);
    return { x: Math.min(mx, Math.max(-mx, x)), y: Math.min(my, Math.max(-my, y)) };
  }
  function pinchCalc(p0, dist, mid) {    // 두 손가락 사이 거리 변화 → 새 배율/위치
    const m = p0.m;
    const raw = Math.min(MAX_ZOOM, Math.max(1, p0.zs * dist / p0.dist));
    const snapped = raw <= SNAP_HI;                        // 처음 모습(100%) 근처면 정확히 100%로
    const z = snapped ? 1 : raw;
    const c = clampT(m, z, mid.x - m.L.x - p0.px * z, mid.y - m.L.y - p0.py * z);
    return { z, x: c.x, y: c.y, snapped, raw };
  }
  function applyZoom() {
    img.style.transform = (zs === 1 && !tx && !ty) ? '' : `translate(${tx}px, ${ty}px) scale(${zs})`;
  }
  function resetZoom(animate) {
    zs = 1; tx = 0; ty = 0; wasOrig = false;
    clearTimeout(pillTimer);
    if (animate) { img.classList.add('anim'); setTimeout(() => img.classList.remove('anim'), 260); }
    img.style.transform = '';
    pill.classList.remove('show', 'idle', 'orig');
  }
  function showPill(isOrig) {
    pill.textContent = isOrig ? '100% 원본 비율' : `${Math.round(zs * 100)}%`;
    if (isOrig && !wasOrig) { pill.classList.remove('orig'); void pill.offsetWidth; }   // 100%에 닿을 때마다 강조 효과 다시 재생
    pill.classList.toggle('orig', isOrig);
    wasOrig = isOrig;
    pill.classList.add('show'); pill.classList.remove('idle');
    clearTimeout(pillTimer);
    pillTimer = setTimeout(settlePill, isOrig ? 1800 : 1200);
  }
  function settlePill() {
    wasOrig = false; pill.classList.remove('orig');
    if (zs > 1.02) { pill.textContent = `${Math.round(zs * 100)}%`; pill.classList.add('idle'); }   // 확대 중에는 작게 남겨 둠 (누르면 100%로 복귀)
    else pill.classList.remove('show', 'idle');
  }
  pill.addEventListener('click', e => {  // 배율 표시를 누르면 100%(처음 모습)로 복귀
    e.stopPropagation();
    img.classList.add('anim'); setTimeout(() => img.classList.remove('anim'), 260);
    zs = 1; tx = 0; ty = 0; applyZoom(); showPill(true);
  });
  ['touchstart', 'touchmove', 'touchend'].forEach(t => pill.addEventListener(t, e => e.stopPropagation(), { passive: true }));
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

  let sx = 0, sy = 0, st = 0, swiped = false, suppressUntil = 0;
  let mode = null, p0 = null, snapped = false;      // mode: 'swipe' | 'pan' | 'pinch'

  function startPinch(e) {
    if (img.hidden || !img.naturalWidth) return;
    const a = e.touches[0], b = e.touches[1], m = metrics();
    const mid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
    p0 = { m, zs, dist: Math.max(1, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)),
           px: (mid.x - m.L.x - tx) / zs, py: (mid.y - m.L.y - ty) / zs };
    p0.left = zs > SNAP_HI;                            // 이번 핀치에서 100%보다 커진 적이 있어야 '100%로 돌아왔다'고 강조
    mode = 'pinch'; swiped = false; snapped = false; origNow = false;
    img.classList.remove('anim');
  }
  stage.addEventListener('touchstart', e => {
    if (e.touches.length >= 2) { startPinch(e); return; }
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); swiped = false;
    if (zs > 1.001) { mode = 'pan'; p0 = { x: sx, y: sy, tx, ty, moved: false }; }
    else mode = 'swipe';
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    if (mode === 'pinch' && e.touches.length >= 2) {
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];
      const r = pinchCalc(p0, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
                          { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
      if (r.raw > SNAP_HI) p0.left = true;
      zs = r.z; tx = r.x; ty = r.y; snapped = r.snapped;
      origNow = snapped && p0.left;                    // 확대했다가 100%로 돌아왔을 때만 강조
      applyZoom(); showPill(origNow);
      return;
    }
    if (mode === 'pan' && e.touches.length === 1) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - p0.x, dy = t.clientY - p0.y;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) p0.moved = true;
      const c = clampT(metrics(), zs, p0.tx + dx, p0.ty + dy);
      tx = c.x; ty = c.y; applyZoom();
    }
  }, { passive: false });

  function endTouch(e) {
    if (mode === 'pinch') {
      if (e.touches.length >= 2) return;
      suppressUntil = Date.now() + 400;               // 핀치 직후 손을 뗄 때 페이지가 넘어가지 않게
      if (zs < 1.02) { zs = 1; tx = 0; ty = 0; applyZoom(); }
      if (zs > 1.001 || origNow) showPill(origNow); else settlePill();
      if (e.touches.length === 1 && zs > 1.001) {
        const t = e.touches[0]; mode = 'pan'; p0 = { x: t.clientX, y: t.clientY, tx, ty, moved: true };
      } else mode = null;
      snapped = false; origNow = false;
      return;
    }
    if (mode === 'pan') {
      if (e.touches.length === 0) { if (p0 && p0.moved) suppressUntil = Date.now() + 250; mode = null; }
      return;
    }
    if (mode === 'swipe' && e.touches.length === 0) {
      mode = null;
      if (e.type !== 'touchend') return;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) {
        swiped = true;
        dx > 0 ? next() : previous();
      }
    }
  }
  stage.addEventListener('touchend', endTouch, { passive: true });
  stage.addEventListener('touchcancel', endTouch, { passive: true });
  stage.addEventListener('click', e => {
    if (swiped || Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); swiped = false; }
  }, true);
  window.addEventListener('resize', () => { if (zs > 1) { const c = clampT(metrics(), zs, tx, ty); tx = c.x; ty = c.y; applyZoom(); } });
  if (window.ResizeObserver) new ResizeObserver(() => { if (zs > 1) { const c = clampT(metrics(), zs, tx, ty); tx = c.x; ty = c.y; applyZoom(); } }).observe(stage);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') next();
    if (e.key === 'ArrowRight') previous();
    if (e.key === 'Escape') closePanels();
  });
  // 앱이 백그라운드로 갈 때 진행 상황 즉시 저장
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      clearTimeout(saveTimer);
      const w = W(); if (w) { store.putWork(w).catch(() => {}); ls.set('mangatap_cur', w.id); }
    }
  });
  window.addEventListener('pagehide', () => { if (currentUrl) URL.revokeObjectURL(currentUrl); });

  /* ---------- 카드끼리 겹친 정도로 판단 (손가락 위치와 무관) ---------- */
  const MERGE_ON = 0.4, MERGE_KEEP = 0.3, MERGE_DWELL = 400;
  function overlapRatio(d, r) {            // 상대 카드(r) 면적 중 끌고 있는 카드(d)에 덮인 비율
    const w = Math.min(d.right, r.right) - Math.max(d.left, r.left);
    const h = Math.min(d.bottom, r.bottom) - Math.max(d.top, r.top);
    if (w <= 0 || h <= 0) return 0;
    return (w * h) / (r.width * r.height);
  }
  function classify(d, r, c, hovering) {   // d: 끌고 있는 카드, r: 상대 카드, c: 끌고 있는 카드의 원래 자리 중심
    const ratio = overlapRatio(d, r);
    const rx = ((d.left + d.width / 2) - r.left) / r.width;
    const ry = ((d.top + d.height / 2) - r.top) / r.height;
    const dx = (r.left + r.width / 2) - c.cx, dy = (r.top + r.height / 2) - c.cy;
    // 카드 중심이 상대 카드를 지나 반대편까지 갔는지 (순서 바꾸기 신호)
    const far = Math.abs(dy) > r.height * 0.5 ? (dy > 0 ? ry > 0.65 : ry < 0.35) : (dx > 0 ? rx > 0.65 : rx < 0.35);
    return { ratio, far, inside: rx > 0 && rx < 1 && ry > 0 && ry < 1, merge: ratio >= (hovering ? MERGE_KEEP : MERGE_ON) && !far };
  }

  /* ---------- 순서 바꾸기 + 그룹 만들기: 꾹 눌러서 끌기 ---------- */
  function applyReorder(ids) {
    const st = sheet.scrollTop;
    const list = ids.map(id => works.find(w => w.id === id) || groups.find(g => g.id === id)).filter(Boolean);
    const before = view ? members(view) : topItems();
    const same = list.length === before.length && list.every((o, i) => o === before[i]);
    if (!same && list.length === before.length) {
      list.forEach((o, i) => { o.order = i; });
      cleanupGroups(); renumber(); resortWorks(); persistAll(); updateButtons();
    }
    openWorks(true); sheet.scrollTop = st;
  }

  workGrid.addEventListener('contextmenu', e => e.preventDefault());
  workGrid.addEventListener('touchstart', e => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('.mini') || e.touches.length !== 1) return;
    const draggedId = card.dataset.id;
    const canMerge = !view && !card.classList.contains('group');   // 그룹 안에 그룹은 만들지 않음
    const t0 = e.touches[0];
    const sx = t0.clientX, sy = t0.clientY;
    let lx = sx, ly = sy, grabDX = 0, grabDY = 0, dragging = false, ticker = null;
    let hoverEl = null, hoverTimer = null, mergeEl = null, overHead = false;
    let lockUntil = 0, lockTimer = null;   // 자리가 바뀐 직후, 다른 카드들이 움직이는 동안은 다시 판단하지 않음 (떨림 방지)

    function clearHover() {
      clearTimeout(hoverTimer); hoverTimer = null; hoverEl = null;
      if (mergeEl) { mergeEl.classList.remove('merge'); mergeEl = null; }
    }
    function layoutCenter() {
      card.style.transform = '';
      const r = card.getBoundingClientRect();
      return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    }
    function place() {
      const c = layoutCenter();
      card.style.transform = `translate(${lx - grabDX - c.cx}px, ${ly - grabDY - c.cy}px) scale(1.06)`;
    }
    function doReorder(cards, from, i) {
      const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
      if (i < from) workGrid.insertBefore(card, cards[i]);
      else workGrid.insertBefore(card, cards[i].nextSibling);
      cards.forEach(c => {
        if (c === card) return;
        const b = before.get(c), a = c.getBoundingClientRect();
        const dx = b.left - a.left, dy = b.top - a.top;
        if (!dx && !dy) return;
        c.style.transition = 'none';
        c.style.transform = `translate(${dx}px, ${dy}px)`;
        void c.offsetWidth;
        c.style.transition = 'transform .18s ease';
        c.style.transform = '';
      });
      lockUntil = Date.now() + 200;
      clearTimeout(lockTimer);
      lockTimer = setTimeout(() => { if (dragging) step(); }, 210);
    }
    function decide() {
      if (Date.now() < lockUntil) return false;
      const d = card.getBoundingClientRect();            // 끌고 있는 카드 자체의 현재 모습 기준
      const cards = Array.from(workGrid.querySelectorAll('.card'));
      const from = cards.indexOf(card);
      let best = -1, bestRatio = 0;
      for (let i = 0; i < cards.length; i++) {
        if (i === from) continue;
        const ratio = overlapRatio(d, cards[i].getBoundingClientRect());
        if (ratio > bestRatio) { bestRatio = ratio; best = i; }
      }
      if (best < 0 || bestRatio < 0.12) { clearHover(); return false; }
      const sib = cards[best];
      const r = sib.getBoundingClientRect();
      const c = layoutCenter();                          // 끌고 있는 카드의 원래 자리 (이 뒤에 place()로 복구)
      const k = classify(d, r, c, hoverEl === sib);
      if (!canMerge) {                                   // 그룹 안 / 그룹 카드 끌기: 카드 중심이 들어오면 바로 순서 변경
        if (k.inside) { doReorder(cards, from, best); return true; }
        return false;
      }
      if (k.merge) {                                     // 충분히 겹쳐서 잠깐 머물면 묶기 후보 (iOS 폴더처럼)
        if (hoverEl !== sib) {
          clearHover(); hoverEl = sib;
          hoverTimer = setTimeout(() => { if (hoverEl === sib) { mergeEl = sib; sib.classList.add('merge'); } }, MERGE_DWELL);
        }
        return false;
      }
      clearHover();
      if (k.far) { doReorder(cards, from, best); return true; }
      return false;
    }
    function updateHead() {
      if (!view) return false;
      const h = gHead.getBoundingClientRect(), d = card.getBoundingClientRect();
      const on = d.top <= h.bottom - 22 && d.bottom > h.top && d.right > h.left && d.left < h.right;
      gHead.classList.toggle('drop', on);
      return on;
    }
    function step() {
      place();
      overHead = updateHead();          // 그룹 안에서 카드가 위쪽 바에 닿으면 "그룹에서 빼기"
      if (overHead) clearHover(); else decide();
      place();                          // decide()는 원래 자리를 재느라 변형을 지우므로, 항상 마지막에 다시 적용
    }
    function tick() {
      if (overHead) return;
      const sr = sheet.getBoundingClientRect();
      const topEdge = sr.top + (view ? 60 : 0) + 40;
      let d = 0;
      if (ly < topEdge) d = -10; else if (ly > sr.bottom - 48) d = 10;
      if (d) { sheet.scrollTop += d; step(); }
    }
    function startDrag() {
      dragging = true;
      card.classList.add('dragging'); workGrid.classList.add('sorting');
      const c = layoutCenter();
      grabDX = lx - c.cx; grabDY = ly - c.cy;
      place();
      ticker = setInterval(tick, 16);
    }
    function cleanup() {
      clearTimeout(timer); clearInterval(ticker); clearTimeout(lockTimer); dragging = false;
      clearHover(); gHead.classList.remove('drop');
      card.removeEventListener('touchmove', onMove);
      card.removeEventListener('touchend', onEnd);
      card.removeEventListener('touchcancel', onEnd);
    }
    function onMove(ev) {
      const tt = ev.touches[0]; lx = tt.clientX; ly = tt.clientY;
      if (!dragging) {
        if (Math.abs(lx - sx) > 10 || Math.abs(ly - sy) > 10) cleanup();   // 스크롤로 판단
        return;
      }
      ev.preventDefault();
      step();
    }
    function onEnd(ev) {
      const was = dragging, target = mergeEl, head = overHead;
      cleanup();
      if (!was) return;
      if (ev.cancelable) ev.preventDefault();
      sortedAt = Date.now();
      card.classList.remove('dragging'); card.style.transform = '';
      workGrid.classList.remove('sorting');
      const st = sheet.scrollTop;
      if (ev.type === 'touchcancel') { openWorks(true); sheet.scrollTop = st; return; }
      if (head) {                                   // 그룹에서 빼기
        const w = works.find(x => x.id === draggedId);
        const g = groups.find(x => x.id === view);
        if (w && g) { w.groupId = null; w.order = g.order + 0.5; restructure(); }
        openWorks(true); sheet.scrollTop = st; return;
      }
      if (target) {                                 // 그룹 만들기 / 그룹에 넣기
        mergeInto(draggedId, target.dataset.id);
        openWorks(true); sheet.scrollTop = st; return;
      }
      applyReorder(Array.from(workGrid.querySelectorAll('.card')).map(c => c.dataset.id));
    }
    const timer = setTimeout(startDrag, 350);
    card.addEventListener('touchmove', onMove, { passive: false });
    card.addEventListener('touchend', onEnd);
    card.addEventListener('touchcancel', onEnd);
  }, { passive: true });

  /* ---------- 시작: 저장된 작품 복원 ---------- */
  (async () => {
    setBarHeightVar();
    db = await openDB();
    try {
      const all = await store.listWorks();
      groups = all.filter(o => o.type === 'group');
      works = all.filter(o => o.type !== 'group');
      works.forEach(w => { if (w.groupId && !groups.some(g => g.id === w.groupId)) w.groupId = null; });
      resortWorks();
    } catch (e) { works = []; groups = []; }
    if (works.length) {
      const last = ls.get('mangatap_cur');
      const k = works.findIndex(w => w.id === last);
      cur = k >= 0 ? k : works.length - 1;
    }
    showPage();
  })();
})();
</script>
<script>
  // 오프라인에서도 열리도록 서비스 워커 등록
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
